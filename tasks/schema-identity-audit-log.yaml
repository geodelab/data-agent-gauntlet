id: schema-identity-audit-log
title: Audit table with an auto-incrementing id
category: schema
tags:
- serial
prompt: |
  Create a table bench_work.audit_log with three columns: id (an auto-incrementing integer
  generated by the database), event_type (text up to 50 characters) and created_at
  (defaults to the current timestamp). Then insert three rows with event_type 'login',
  'logout' and 'purchase', letting the database fill id and created_at.
checks:
- type: scalar_equals
  name: three rows with generated ids
  expected: 1
  sql: |
    SELECT CASE WHEN COUNT(*) = 3 AND COUNT(DISTINCT id) = 3 AND COUNT(id) = 3
                 AND SUM(CASE WHEN created_at IS NULL THEN 1 ELSE 0 END) = 0
                THEN 1 ELSE 0 END
    FROM bench_work.audit_log
