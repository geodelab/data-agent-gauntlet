id: loading-insert-get-id
title: Insert a row and get its generated id
category: loading
tags:
- returning
prompt: |
  Insert a new row into bench_work.category_copy with catgroup 'Concerts', catname
  'JazzFest' and catdesc 'Jazz festivals'. catid is generated by the database. Find out
  which catid was generated for the new row and write just that number (nothing else)
  to a file named answer.txt in the current directory. Insert the row only once.
setup_sql: |
  CREATE TABLE bench_work.category_copy (
    catid BIGINT IDENTITY(1,1),
    catgroup VARCHAR(10),
    catname VARCHAR(10),
    catdesc VARCHAR(50)
  );
  INSERT INTO bench_work.category_copy (catgroup, catname, catdesc)
    SELECT catgroup, catname, catdesc FROM bench.category;
  GRANT ALL ON ALL TABLES IN SCHEMA bench_work TO PUBLIC;
checks:
- type: scalar_equals
  name: inserted exactly once
  sql: SELECT COUNT(*) FROM bench_work.category_copy WHERE catname = 'JazzFest'
  expected: 1
- type: file_equals_sql
  name: reported id is correct
  file: answer.txt
  sql: SELECT MAX(catid) FROM bench_work.category_copy WHERE catname = 'JazzFest'
