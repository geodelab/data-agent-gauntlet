AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-data-agent-bench sandbox: an Amazon Redshift Serverless workgroup, a private S3
  bucket for UNLOAD output, and a narrowly scoped IAM role the AI agent assumes.
  Delete this stack (adab teardown) to remove everything.

Parameters:
  Prefix:
    Type: String
    Default: adab
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
    Description: Name prefix for all resources.
  BaseCapacity:
    Type: Number
    Default: 8
    AllowedValues: [8, 16, 32]
    Description: Redshift Serverless base capacity in RPUs. 8 is enough for the TICKIT dataset.
  AgentTrustedPrincipalArn:
    Type: String
    Default: ""
    Description: >-
      Optional. ARN of the IAM user or role allowed to assume the agent role. Leave empty
      to trust any principal in this account that has sts:AssumeRole permission.

  SubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Optional. Subnets in at least 3 Availability Zones for the workgroup. Leave empty to use
      the default VPC. Accounts without a default VPC must set this.

Conditions:
  HasTrustedPrincipal: !Not [!Equals [!Ref AgentTrustedPrincipalArn, ""]]
  HasSubnetIds: !Not [!Equals [!Join ["", !Ref SubnetIds], ""]]

Resources:
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-benchmark-output
            Status: Enabled
            ExpirationInDays: 7

  RedshiftRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Default role for the benchmark namespace (COPY from the sample bucket, UNLOAD to the output bucket).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - redshift.amazonaws.com
                - redshift-serverless.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: adab-redshift-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSampleData
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - arn:aws:s3:::redshift-downloads
                  - arn:aws:s3:::redshift-downloads/*
              - Sid: ReadWriteOutput
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt OutputBucket.Arn
                  - !Sub "${OutputBucket.Arn}/*"

  Namespace:
    Type: AWS::RedshiftServerless::Namespace
    Properties:
      NamespaceName: !Sub "${Prefix}-ns"
      DbName: dev
      AdminUsername: adabadmin
      ManageAdminPassword: true
      IamRoles:
        - !GetAtt RedshiftRole.Arn
      DefaultIamRoleArn: !GetAtt RedshiftRole.Arn

  Workgroup:
    Type: AWS::RedshiftServerless::Workgroup
    DependsOn: Namespace
    Properties:
      WorkgroupName: !Sub "${Prefix}-wg"
      NamespaceName: !Sub "${Prefix}-ns"
      BaseCapacity: !Ref BaseCapacity
      PubliclyAccessible: false
      SubnetIds: !If [HasSubnetIds, !Ref SubnetIds, !Ref "AWS::NoValue"]

  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role the AI coding agent assumes during the benchmark. Limited to the benchmark workgroup and output bucket.
      MaxSessionDuration: 14400
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !If
                - HasTrustedPrincipal
                - !Ref AgentTrustedPrincipalArn
                - !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: adab-agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunSqlOnBenchmarkWorkgroup
                Effect: Allow
                Action:
                  - redshift-data:ExecuteStatement
                  - redshift-data:BatchExecuteStatement
                  - redshift-data:ListDatabases
                  - redshift-data:ListSchemas
                  - redshift-data:ListTables
                  - redshift-data:DescribeTable
                Resource: !GetAtt Workgroup.Workgroup.WorkgroupArn
              - Sid: ReadOwnStatements
                Effect: Allow
                Action:
                  - redshift-data:DescribeStatement
                  - redshift-data:GetStatementResult
                  - redshift-data:ListStatements
                  - redshift-data:CancelStatement
                Resource: "*"
              - Sid: TemporaryDatabaseCredentials
                Effect: Allow
                Action: redshift-serverless:GetCredentials
                Resource: !GetAtt Workgroup.Workgroup.WorkgroupArn
              - Sid: DescribeServerless
                Effect: Allow
                Action:
                  - redshift-serverless:GetWorkgroup
                  - redshift-serverless:GetNamespace
                  - redshift-serverless:ListWorkgroups
                  - redshift-serverless:ListNamespaces
                Resource: "*"
              - Sid: OutputBucket
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt OutputBucket.Arn
                  - !Sub "${OutputBucket.Arn}/*"
              - Sid: ReadSampleData
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - arn:aws:s3:::redshift-downloads
                  - arn:aws:s3:::redshift-downloads/*

Outputs:
  WorkgroupName:
    Value: !Sub "${Prefix}-wg"
  WorkgroupArn:
    Value: !GetAtt Workgroup.Workgroup.WorkgroupArn
  NamespaceName:
    Value: !Sub "${Prefix}-ns"
  OutputBucketName:
    Value: !Ref OutputBucket
  AgentRoleArn:
    Value: !GetAtt AgentRole.Arn
