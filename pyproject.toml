[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-agent-gauntlet"
version = "0.1.1"
description = "An open benchmark for AI coding agents doing real data work on AWS: Amazon Redshift first, with and without agent skills."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ganesh Kumar P" }]
keywords = ["aws", "redshift", "ai-agents", "benchmark", "mcp", "agent-skills", "evaluation"]
dependencies = [
  "boto3>=1.34",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "cfn-lint>=1.0"]

[project.scripts]
dagt = "adab.cli:main"
adab = "adab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adab = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
